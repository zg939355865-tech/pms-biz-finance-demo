<!DOCTYPE html>
<html lang="zh-CN" data-legacy-bridge="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>监控界面 - PMS业财一体化</title>
  <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #F1F5F9; }
    .page-container { padding: 16px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .detail-header {
      background: #fff;
      border-radius: 8px;
      padding: 12px 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      width: 36px; height: 36px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      background: #fff;
      color: #64748B;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #F9FAFB; color: #2563EB; border-color: #2563EB; }
    .header-title { font-size: 18px; font-weight: 600; color: #1E293B; }

    .image-wrap {
      flex: 1;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .image-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }
  </style>
  <link rel="stylesheet" href="../prototype-resources/components/tokens.css">
  <link rel="stylesheet" href="../prototype-resources/components/components.css">
  <link rel="stylesheet" href="../prototype-resources/components/legacy-page-bridge.css">
  <script defer src="../prototype-resources/components/legacy-page-bridge.js"></script>
</head>
<body>
  <div id="app" class="page-container">
    <div class="detail-header">
      <div class="header-left">
        <button class="btn-back" onclick="history.back()" title="返回列表">
          <i class="fas fa-arrow-left"></i>
        </button>
        <span class="header-title">监控界面 - {{ projectName }}</span>
      </div>
    </div>
    <div class="image-wrap">
      <img src="../docs/images/监控界面.png" alt="监控界面">
    </div>
  </div>
  <script>
    const code = new URLSearchParams(location.search).get('code') || ''
    document.querySelector('.header-title').textContent = '监控界面 - ' + (code || '')
  </script>
</body>
</html>
