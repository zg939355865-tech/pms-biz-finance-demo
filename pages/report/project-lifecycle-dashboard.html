    <style>html[data-page-code="project-lifecycle-dashboard"] { background: var(--color-screen-bg); }
html[data-page-code="project-lifecycle-dashboard"] body { background: var(--color-screen-bg); }
html[data-page-code="project-lifecycle-dashboard"] #app { max-width: none; padding: 24px; background: transparent; }
.cockpit { --ink: var(--color-screen-text); --muted: color-mix(in srgb, var(--color-screen-text) 80%, var(--color-viz-neutral)); --cyan: var(--color-viz-teal); color: var(--ink); font-family: "Alibaba PuHuiTi", "Microsoft YaHei", sans-serif; }

#cockpit-dialog { width: min(var(--dialog-width, 680px), calc(100vw - 48px)); max-height: 85vh; padding: 0; border-radius: 12px; border: 1px solid var(--color-screen-panel-strong); background: var(--color-screen-bg); color: var(--color-screen-text); box-shadow: 0 24px 80px var(--color-mask); }
#cockpit-dialog::backdrop { background: var(--color-mask); backdrop-filter: blur(4px); }
#cockpit-dialog .dialog-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 24px; border-bottom: 1px solid var(--color-screen-panel-strong); margin: 0; }
#cockpit-dialog .dialog-heading h2 { margin: 0; font-size: 20px; font-weight: 600; color: var(--color-bg-card); line-height: 28px; }
#cockpit-dialog button { background: var(--color-screen-panel); color: var(--color-screen-text); border: 1px solid var(--color-screen-panel-strong); padding: 0 12px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
#cockpit-dialog button:hover:not(:disabled) { background: var(--color-screen-panel-strong); border-color: var(--color-viz-teal); }
#cockpit-dialog button:focus-visible { outline: 2px solid var(--color-viz-teal); outline-offset: 3px; }
#cockpit-dialog button:disabled { opacity: .4; cursor: default; }
#cockpit-dialog #cockpit-dialog-close { width: 36px; height: 36px; border: none; background: transparent; font-size: 24px; padding: 0; flex-shrink: 0; }
#cockpit-dialog-content { margin: 20px 24px 0; min-height: 328px; }
#cockpit-dialog-content table { border-collapse: collapse; table-layout: fixed; width: 100%; font-size: 14px; }
#cockpit-dialog-content th { height: 48px; background: var(--color-screen-panel); color: var(--color-screen-text); font-weight: 400; }
#cockpit-dialog-content td { height: 56px; }
#cockpit-dialog-content td,#cockpit-dialog-content th { padding: 0 16px; border-bottom: 1px solid var(--color-screen-panel-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cockpit-dialog-content tbody tr:hover { background: var(--color-screen-panel); }
#cockpit-dialog-content [data-column="value"] { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-bg-card); }
#cockpit-dialog-content [data-column="month"] { font-variant-numeric: tabular-nums; letter-spacing: .5px; }
#cockpit-dialog-footer { margin: 20px 24px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
#cockpit-dialog-footer .dialog-count { margin-right: auto; }
#cockpit-dialog-footer .dialog-page-number { margin-right: 4px; min-width: 36px; text-align: center; font-variant-numeric: tabular-nums; }
@media(min-width:1800px) { .cockpit-panel { padding: 24px; } .chart-content svg { height: 250px; } .donut { width: 184px; height: 184px; } .rank-list { gap: 18px; } .rank-name { font-size: 14px; } #type-distribution .chart-content svg { height: 300px; } }
@media(max-width:1050px) { .cockpit-header { align-items: flex-start; } .cockpit-controls { flex-wrap: wrap; justify-content: flex-end; } .cockpit-controls label { gap: 4px; } .cockpit-panel { padding: 16px; } .cockpit-top-grid { grid-template-columns: 1fr 1fr; } #industry-share { grid-column: span 2; } .donut-wrap { flex-direction: row; gap: 40px; } .donut { flex-shrink: 0; margin: 0; } .share-legend { grid-template-columns: repeat(3,1fr); } .cockpit-bottom-grid { grid-template-columns: 1fr 1fr; } }
@media(max-width:760px) { .cockpit-header { flex-direction: column; } .cockpit-controls { justify-content: flex-start; } .cockpit-metrics,.cockpit-top-grid,.cockpit-bottom-grid { grid-template-columns: 1fr; } #industry-share { grid-column: auto; } .donut-wrap { flex-direction: column; gap: 12px; } .share-legend { grid-template-columns: 1fr 1fr; } .cockpit-context,.cockpit-footnote { gap: 12px; flex-direction: column; align-items: flex-start; } }
</style>
  <div class="cockpit" id="cockpit-root" data-component="Space">
    <header class="cockpit-header"><div class="cockpit-brand"><span class="brand-mark" aria-hidden="true">◈</span><div><div class="eyebrow">项目全生命周期 · 管理总览</div><h1>项目驾驶舱</h1></div></div><div class="cockpit-controls"><label>所属行业<select id="cockpit-industry" aria-label="所属行业"><option value="">全部行业</option><option>污水厂</option><option>水泥</option><option>钢铁</option><option>化工</option><option>光伏</option></select></label><button id="cockpit-reset">重置</button></div></header>

    <div class="cockpit-top-grid">
      <section class="cockpit-panel" id="demand-trend" data-component="ProChartCard"><header class="panel-heading"><div><h2>项目需求月度趋势</h2></div><button class="chart-data" data-view="demand-trend" aria-label="查看项目需求月度趋势数据">数据 ↗</button></header><div class="trend-headline" id="trend-headline"></div><div class="chart-content"></div></section>

    <div class="cockpit-bottom-grid">
      <section class="cockpit-panel" id="type-distribution" data-component="ProChartCard"><header class="panel-heading"><div><h2>需求类型分布</h2></div><button class="chart-data" data-view="type-distribution" aria-label="查看需求类型分布数据">数据 ↗</button></header><div class="chart-content"></div></section>
      <section class="cockpit-panel" id="province-ranking" data-component="ProChartCard"><header class="panel-heading"><div><h2>项目区域需求排名</h2></div><button class="chart-data" data-view="province-ranking" aria-label="查看项目区域需求排名数据">数据 ↗</button></header><div class="chart-content"></div></section>
      <section class="cockpit-panel" id="requester-ranking" data-component="ProChartCard"><header class="panel-heading"><div><h2>需求提出人排名</h2></div><button class="chart-data" data-view="requester-ranking" aria-label="查看需求提出人排名数据">数据 ↗</button></header><div class="chart-content"></div></section>
      <section class="cockpit-panel" id="manager-ranking" data-component="ProChartCard"><header class="panel-heading"><div><h2>项目经理负责项目排名</h2></div><button class="chart-data" data-view="manager-ranking" aria-label="查看项目经理负责项目排名数据">数据 ↗</button></header><div class="chart-content"></div></section>

  <dialog id="cockpit-dialog" aria-labelledby="cockpit-dialog-title"><div class="dialog-heading"><h2 id="cockpit-dialog-title"></h2><button id="cockpit-dialog-close" aria-label="关闭">×</button></div><div id="cockpit-dialog-content"></div><footer id="cockpit-dialog-footer"></footer></dialog>
  <script>(function projectCockpitRuntime(config) {
  const $ = (s) => document.querySelector(s);
  const escape = (x) => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const colors = ['var(--color-viz-teal)', 'var(--color-viz-sky)', 'var(--color-viz-purple)', 'var(--color-viz-orange)', 'var(--color-viz-green)'];
  const monthKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
  const baseDate = new Date();
  const baseMonth = monthKey(baseDate);
  const records = config.records.map(r => ({ ...r, month: monthKey(new Date(baseDate.getFullYear(), baseDate.getMonth() + r.monthOffset, 1)) }));
  const hiddenIndustries = new Set();
  let scoped = [], months = [], dialogRows = [], dialogPage = 1, dialogColumns = [];
  const dialog = $('#cockpit-dialog');
  const group = (rows, field, labels) => (labels || [...new Set(rows.map(r => r[field]))]).map(label => ({ label, value: rows.filter(r => r[field] === label).length }));
  const sorted = (rows, field, limit) => group(rows, field).sort((a,b) => b.value - a.value || a.label.localeCompare(b.label, 'zh-CN')).slice(0, limit);
  const demands = () => scoped.filter(r => r.kind === 'requirement');
  const projects = () => scoped.filter(r => r.kind === 'project');
  function openSummary(id, selection = {}) {
    if (!config.dialogs[id]) return;
    const rows = demands();
    let summary = [];
    if (id === 'demand-trend') summary = months.map(month=>({ month:month.replace('-',''), value:rows.filter(r=>r.month===month).length }));
    else if (id === 'industry-trend') summary = months.flatMap(month=>config.industries.filter(industry=>!hiddenIndustries.has(industry)&&(!$('#cockpit-industry').value||industry===$('#cockpit-industry').value)).map(industry=>({month:month.replace('-',''), value:rows.filter(r=>r.month===month&&r.industry===industry).length, industry})));
    else if (id === 'type-distribution') summary = group(rows, 'type', config.types);
    else if (id === 'province-ranking') summary = sorted(rows, 'province', 7);
    else if (id === 'requester-ranking') summary = sorted(rows, 'requester', 7);
    else if (id === 'manager-ranking') summary = sorted(projects(), 'manager', Infinity);
    if (selection.month) summary = summary.filter(r=>r.month===selection.month.replace('-',''));
    if (selection.industry) summary = summary.filter(r=>r.industry===selection.industry);
    if (selection.value) summary = summary.filter(r=>r.label===selection.value);
    if (config.dialogs[id].monthOrder === 'desc') summary.sort((a,b)=>b.month.localeCompare(a.month));
    openRows($(`#${id} h2`).textContent, summary, id);
  }
  function openRows(title, rows, type) {
    dialogRows = rows;
    dialogColumns = config.dialogs[type].columns;
    dialog.style.setProperty('--dialog-width', `${config.dialogs[type].width}px`);
    dialog.dataset.layout = dialogColumns.length >= 4 ? 'business' : 'summary';
    dialogPage = 1;
    $('#cockpit-dialog-title').textContent = title;
    renderDialog();
    if (!dialog.open) dialog.showModal();
  }
  function renderDialog() {
    const maxPage = Math.max(1, Math.ceil(dialogRows.length / 5));
    const rows = dialogRows.slice((dialogPage - 1) * 5, dialogPage * 5);
    $('#cockpit-dialog-content').innerHTML = `<table><colgroup>${dialogColumns.map(c=>`<col style="width:${c.widthPercent}%">`).join('')}</colgroup><thead><tr>${dialogColumns.map(c=>`<th style="text-align:${c.align || 'left'}">${escape(c.label)}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr>${dialogColumns.map(c=>`<td data-column="${c.field}" style="text-align:${c.align || 'left'}" title="${escape(r[c.field])}">${escape(r[c.field])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${dialogColumns.length}" style="text-align:center">当前筛选范围暂无数据</td></tr>`}</tbody></table>`;
    $('#cockpit-dialog-footer').innerHTML = `<span class="dialog-count">共 ${dialogRows.length} 条 · 5条/页</span><span class="dialog-page-number">${dialogPage} / ${maxPage}</span><button data-dialog-page="-1" ${dialogPage === 1 ? 'disabled' : ''}>上一页</button><button data-dialog-page="1" ${dialogPage >= maxPage ? 'disabled' : ''}>下一页</button>`;
  }
  $('#cockpit-dialog-footer').addEventListener('click', e => {
    const button = e.target.closest('[data-dialog-page]');
    if (!button || button.disabled) return;
    dialogPage += Number(button.dataset.dialogPage); renderDialog();
  });
  $('#cockpit-dialog-close').onclick = () => dialog.close();
  dialog.addEventListener('click', e => { if (e.target === dialog && (e.clientX < dialog.getBoundingClientRect().left || e.clientX > dialog.getBoundingClientRect().right || e.clientY < dialog.getBoundingClientRect().top || e.clientY > dialog.getBoundingClientRect().bottom)) dialog.close(); });
  function svgLine(series, total = false) {
    const width = 420, height = 210, left = 30, right = 14, top = 24, bottom = 34;
    const maximum = Math.max(5, Math.ceil(Math.max(...series.flatMap(s => s.values)) / 5) * 5);
    const x = i => left + i * (width - left - right) / 5;
    const y = v => height - bottom - v / maximum * (height - top - bottom);
    const baseline = height - bottom;
    const grid = [0, .25, .5, .75, 1].map(v => `<line x1="${left}" x2="${width-right}" y1="${y(maximum*v)}" y2="${y(maximum*v)}" stroke="var(--color-screen-panel-strong)" stroke-dasharray="3 5"/><text x="${left-8}" y="${y(maximum*v)+4}" text-anchor="end">${Math.round(maximum*v)}</text>`).join('');
    return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${total ? '项目需求' : '行业需求'}最近六个月趋势"><defs><linearGradient id="demand-area" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--color-viz-teal)" stop-opacity=".26"/><stop offset="100%" stop-color="var(--color-viz-teal)" stop-opacity="0"/></linearGradient></defs>${grid}${months.map((m,i)=>`<text x="${x(i)}" y="${height-9}" text-anchor="middle">${Number(m.slice(5))}月</text>`).join('')}${series.map(s => {
      const points = s.values.map((v,i) => `${x(i)},${y(v)}`).join(' ');

    else if(action==='approve'||action==='reject'){var reviewOverlay=target.closest('[data-overlay]');if(reviewOverlay&&action==='approve'){var invalid=reviewOverlay.querySelector('[required]:invalid');if(invalid){invalid.reportValidity();return;}var sources=Array.from(reviewOverlay.querySelectorAll('[data-field]'));sources.filter(function(source){return !source.dataset.dependsOn;}).forEach(function(source){var destination=document.querySelector('[data-page-view="detail"] [data-field="'+CSS.escape(source.dataset.field)+'"]');if(destination&&source.value)destination.value=source.value;});syncDependentFields(document.querySelector('[data-page-view="detail"]'));sources.filter(function(source){return source.dataset.dependsOn;}).forEach(function(source){var destination=document.querySelector('[data-page-view="detail"] [data-field="'+CSS.escape(source.dataset.field)+'"]');if(destination&&source.value)destination.value=source.value;});}if(reviewOverlay)reviewOverlay.hidden=true;}
    else if(action==='upload'){var fileUpload=target.closest('.schema-file-upload');var fileInput=fileUpload&&fileUpload.querySelector('input[type="file"]');if(fileInput&&!fileInput.disabled)fileInput.click();return;}
  });
  function syncDetailInlineEditability(){var detailRoot=document.querySelector('[data-page-view="detail"]');if(!detailRoot)return;var editable=detailRoot.dataset.detailEditable==='true';detailRoot.querySelectorAll('[data-inline-edit="true"]').forEach(function(table){if(!editable)table.querySelectorAll('tr[data-row-value]').forEach(function(row){setInlineRowEditing(row,false);});table.querySelectorAll('[data-act="edit-row"],[data-act="remove-row"]').forEach(function(button){button.disabled=!editable;button.setAttribute('aria-disabled',String(button.disabled));});});detailRoot.querySelectorAll('[data-act]').forEach(function(x){if(['open','get-location','remove-row','add-row','split','create-child','upload','batch-delete'].includes(x.dataset.act))x.disabled=!editable;});}
  var detailEditRoot=document.querySelector('[data-page-view="detail"]');if(detailEditRoot){new MutationObserver(syncDetailInlineEditability).observe(detailEditRoot,{attributes:true,attributeFilter:['data-detail-editable']});syncDetailInlineEditability();}
  if(masterDetailMode){
    var masterTable=document.querySelector('.schema-master-pane [data-component="ProTable"]');
    var masterCount=document.querySelector('[data-master-count]');
    function syncMasterCount(){if(masterCount&&masterTable)masterCount.textContent=tableRows(masterTable).filter(function(row){return row.dataset.filterMatch!=='false';}).length+' 条';}
    function setMasterDetailActionMode(editing){var detailRoot=document.querySelector('.schema-detail-pane');var viewActions=document.querySelector('[data-detail-view-actions]');var editActions=document.querySelector('[data-detail-edit-actions]');if(viewActions)viewActions.hidden=editing;if(editActions)editActions.hidden=!editing;if(detailRoot){detailRoot.dataset.detailEditable=String(editing);detailRoot.querySelectorAll('[data-field]').forEach(function(field){if(!field.matches('input,select,textarea')||field.closest('[data-inline-edit="true"]'))return;field.disabled=field.dataset.schemaReadonly==='true'||field.dataset.schemaDisabled==='true'||!editing;});detailRoot.querySelectorAll('[data-act="open"],[data-act="get-location"],[data-act="remove-row"],[data-act="add-row"],[data-act="split"],[data-act="create-child"],[data-act="upload"],[data-act="batch-delete"]').forEach(function(action){if(action.dataset.allowReadonly)return;action.disabled=!editing;action.setAttribute('aria-disabled',String(!editing));});detailRoot.querySelectorAll('[data-row-select],[data-act="select-all"]').forEach(function(control){control.disabled=!editing;control.setAttribute('aria-disabled',String(!editing));});}}
    function syncMasterDetailHeading(row){if(!row)return;var value={};try{value=JSON.parse(row.dataset.rowValue||'{}');}catch(error){}var title=document.querySelector('[data-detail-title]');var subtitle=document.querySelector('[data-detail-subtitle]');if(title&&masterDetailTitleField)title.textContent=String(value[masterDetailTitleField]||'项目驾驶舱');if(subtitle)subtitle.textContent=masterDetailSubtitleFields.map(function(code){return value[code];}).filter(Boolean).join(' · ');tableRows(masterTable).forEach(function(item){item.classList.toggle('is-active',item===row);});}
    document.addEventListener('click',function(event){var actionTarget=event.target.closest('[data-act]');if(!actionTarget)return;var action=actionTarget.dataset.act;if((action==='view'||action==='edit')&&actionTarget.closest('.schema-master-pane')){var row=actionTarget.closest('tr[data-row-value]');syncMasterDetailHeading(row);setMasterDetailActionMode(false);}else if(action==='edit-current'&&activeDetailRow){switchView('detail','编辑','草稿',true);syncMasterDetailHeading(activeDetailRow);setMasterDetailActionMode(true);}else if((action==='refresh-current'||action==='cancel-edit')&&activeDetailRow){populateDetailFromRow(activeDetailRow);switchView('detail','查看','草稿',true);syncMasterDetailHeading(activeDetailRow);setMasterDetailActionMode(false);}else if(action==='create'){var title=document.querySelector('[data-detail-title]');var subtitle=document.querySelector('[data-detail-subtitle]');if(title)title.textContent='新增项目驾驶舱';if(subtitle)subtitle.textContent='';tableRows(masterTable).forEach(function(item){item.classList.remove('is-active');});setMasterDetailActionMode(true);}else if(action==='submit'){setMasterDetailActionMode(false);}setTimeout(syncMasterCount,0);});
    if(masterTable){new MutationObserver(syncMasterCount).observe(masterTable,{childList:true,subtree:true});var firstLink=masterTable.querySelector('tr[data-row-value]:not([hidden]) a[data-act="view"],tr[data-row-value]:not([hidden]) a[data-act="edit"]');if(firstLink)firstLink.click();}
    syncMasterCount();
  }
  var sampleParams=new URLSearchParams(location.search);var sampleView=sampleParams.get('sample');
  document.querySelectorAll('[data-default-today="true"]').forEach(function(field){if(!field.value){var now=new Date();var localDate=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);field.value=localDate;}});
  syncDependentFields(document);
  syncVisibility(document);
  syncEditableCalculations(document);
  syncDetailActionRequirements(document);
  document.addEventListener('blur',function(e){if(e.target.matches('input[type="number"][data-precision]')&&e.target.value!==''&&Number.isFinite(Number(e.target.value))){normalizeSignedInput(e.target);e.target.value=Number(e.target.value).toFixed(Number(e.target.dataset.precision));}},true);
  document.querySelectorAll('[data-component="ProTable"][data-page-size],[data-component="ProTreeTable"][data-page-size],[data-component="ProMonitorCardGrid"][data-page-size]').forEach(function(table){applyTablePagination(table,1);});
  document.querySelectorAll('[data-page-view="list"] [data-component="ProSearchForm"]').forEach(applyListFilters);
  document.querySelectorAll('[data-component="ProFilterTabs"]').forEach(applyListFilters);
  if(sampleView==='detail'){
    var recordField=sampleParams.get('recordField');var recordValue=sampleParams.get('recordValue');var sampleRow=null;var sampleRowValue={};
    if(recordField&&recordValue){sampleRow=tableRows(document.querySelector('[data-page-view="list"] [data-component="ProTable"]')).find(function(row){var value={};try{value=JSON.parse(row.dataset.rowValue||'{}');}catch(error){}return String(value[recordField]??'')===recordValue;})||null;if(sampleRow){try{sampleRowValue=JSON.parse(sampleRow.dataset.rowValue||'{}');}catch(error){}}}
    var sampleStatus=sampleParams.get('status')||sampleRowValue.status||'草稿';var sampleMode=sampleParams.get('mode')||(sampleStatus==='草稿'?'编辑':/待.*(审|批)|审核中|审批中/.test(sampleStatus)?'审核':'查看');
    switchView('detail',sampleMode,sampleStatus);if(sampleRow){activeDetailRow=sampleRow;populateDetailFromRow(sampleRow);switchView('detail',sampleMode,sampleStatus,true);}
    var sampleTab=sampleParams.get('tab');if(sampleTab){var tabButton=document.querySelector('[data-tab="'+CSS.escape(sampleTab)+'"]');if(tabButton)tabButton.click();}
  }
})();
