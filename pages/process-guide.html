<!DOCTYPE html>
<html lang="zh-CN" data-legacy-bridge="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流程指引 - PMS业财一体化</title>
  <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <style>
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #F1F5F9; margin: 0; padding: 0; }
    .page-container { padding: 20px; }

    .page-header {
      background: #fff;
      padding: 16px 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: #1E293B;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-title i { color: #2563EB; }

    .header-btn {
      background: #2563EB;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .content-card {
      background: #fff;
      border-radius: 8px;
      padding: 32px;
    }

    .flow-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flow-step {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .step-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #2563EB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .step-circle i {
      font-size: 24px;
      color: #2563EB;
    }

    .step-circle span {
      font-size: 12px;
      color: #2563EB;
      font-weight: 500;
      margin-top: 2px;
    }

    .step-label {
      margin-top: 12px;
      font-size: 14px;
      color: #1E293B;
      font-weight: 500;
    }

    .step-desc {
      margin-top: 6px;
      font-size: 12px;
      color: #64748B;
      text-align: center;
      max-width: 100px;
    }

    .flow-arrow {
      width: 80px;
      height: 3px;
      background: #CBD5E1;
      position: relative;
      z-index: 1;
      margin: 0 8px;
    }

    .flow-arrow::after {
      content: '';
      position: absolute;
      right: -8px;
      top: -6px;
      border: 8px solid transparent;
      border-left-color: #CBD5E1;
    }
  </style>
  <link rel="stylesheet" href="../prototype-resources/components/tokens.css">
  <link rel="stylesheet" href="../prototype-resources/components/components.css">
  <link rel="stylesheet" href="../prototype-resources/components/legacy-page-bridge.css">
  <script defer src="../prototype-resources/components/legacy-page-bridge.js"></script>
</head>
<body>
  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">
        <i class="fas fa-compass"></i>
        流程指引
      </h1>
      <button class="header-btn">
        <i class="fas fa-th-large"></i>
        流程指引
      </button>
    </div>

    <div class="content-card">
      <div class="flow-container">
        <div class="flow-step">
          <div class="step-circle">
            <i class="fas fa-edit"></i>
            <span>1</span>
          </div>
          <div class="step-label">需求提出</div>
          <div class="step-desc">提交项目需求申请</div>
        </div>

        <div class="flow-arrow"></div>

        <div class="flow-step">
          <div class="step-circle">
            <i class="fas fa-clipboard-check"></i>
            <span>2</span>
          </div>
          <div class="step-label">需求评审</div>
          <div class="step-desc">评审需求可行性</div>
        </div>

        <div class="flow-arrow"></div>

        <div class="flow-step">
          <div class="step-circle">
            <i class="fas fa-check-circle"></i>
            <span>3</span>
          </div>
          <div class="step-label">需求确认</div>
          <div class="step-desc">确认需求内容</div>
        </div>

        <div class="flow-arrow"></div>

        <div class="flow-step">
          <div class="step-circle">
            <i class="fas fa-paper-plane"></i>
            <span>4</span>
          </div>
          <div class="step-label">任务下达</div>
          <div class="step-desc">下达项目任务</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
