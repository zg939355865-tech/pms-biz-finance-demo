<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据选择弹窗模板</title>
  <link rel="stylesheet" href="../components/tokens.css" />
  <link rel="stylesheet" href="../components/base.css" />
  <link rel="stylesheet" href="../components/layout.css" />
  <link rel="stylesheet" href="../components/components.css" />
</head>
<body>
  <div class="modal-mask">
    <section class="modal data-select-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header">
        <span class="modal-title" id="modalTitle">选择物料</span>
        <button class="modal-close" id="closeButton" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7.4 6 4.6 4.6L16.6 6 18 7.4 13.4 12l4.6 4.6-1.4 1.4-4.6-4.6L7.4 18 6 16.6l4.6-4.6L6 7.4 7.4 6Z"/></svg>
        </button>
      </header>

      <div class="modal-body">
        <div class="data-select-search">
          <div class="form-group">
            <input class="form-input" id="keyword" type="search" aria-label="搜索物料" placeholder="请输入物料编码或物料名称" />
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" id="queryButton">查询</button>
            <button class="btn" id="resetButton">重置</button>
          </div>
        </div>

        <div class="eam-table-wrapper">
          <table class="eam-table">
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAll" aria-label="全选" /></th>
                <th>物料编码</th>
                <th>物料名称</th>
                <th>规格型号</th>
                <th>单位</th>
              </tr>
            </thead>
            <tbody id="dataBody">
              <tr class="select-row" data-search="M-001 单晶硅片">
                <td><input class="row-check" type="checkbox" /></td>
                <td><a href="#">M-001</a></td><td>单晶硅片</td><td>182mm</td><td>片</td>
              </tr>
              <tr class="select-row" data-search="M-002 银浆">
                <td><input class="row-check" type="checkbox" /></td>
                <td><a href="#">M-002</a></td><td>银浆</td><td>500g/瓶</td><td>瓶</td>
              </tr>
              <tr class="select-row" data-search="M-003 氮化硅粉">
                <td><input class="row-check" type="checkbox" /></td>
                <td><a href="#">M-003</a></td><td>氮化硅粉</td><td>高纯</td><td>kg</td>
              </tr>
              <tr class="select-row" data-search="M-004 铝浆">
                <td><input class="row-check" type="checkbox" /></td>
                <td><a href="#">M-004</a></td><td>铝浆</td><td>500g/瓶</td><td>瓶</td>
              </tr>
              <tr class="select-row" data-search="M-005 EVA胶膜">
                <td><input class="row-check" type="checkbox" /></td>
                <td><a href="#">M-005</a></td><td>EVA胶膜</td><td>0.5mm</td><td>卷</td>
              </tr>
            </tbody>
          </table>
          <div class="pagination">
            <span>共 8 条</span>
            <button class="pagination-btn" disabled>‹</button>
            <button class="pagination-btn active">1</button>
            <button class="pagination-btn">2</button>
            <button class="pagination-btn">›</button>
          </div>
        </div>
      </div>

      <footer class="modal-footer">
        <button class="btn" id="cancelButton">取消</button>
        <button class="btn btn-primary" id="confirmButton" disabled>确定（0项）</button>
      </footer>
    </section>
  </div>

  <script src="../components/mock.js"></script>
  <script>
    const rows = Array.from(document.querySelectorAll('#dataBody tr'));
    const checks = Array.from(document.querySelectorAll('.row-check'));
    const selectAll = document.getElementById('selectAll');
    const confirmButton = document.getElementById('confirmButton');

    function queryData() {
      const keyword = document.getElementById('keyword').value.trim().toLowerCase();
      rows.forEach(function (row) {
        row.hidden = keyword && !row.dataset.search.toLowerCase().includes(keyword);
      });
      updateSelection();
    }

    function updateSelection() {
      const visibleChecks = checks.filter(function (item) { return !item.closest('tr').hidden; });
      const selected = checks.filter(function (item) { return item.checked; }).length;
      const visibleSelected = visibleChecks.filter(function (item) { return item.checked; }).length;
      confirmButton.disabled = selected === 0;
      confirmButton.textContent = '确定（' + selected + '项）';
      selectAll.checked = visibleChecks.length > 0 && visibleSelected === visibleChecks.length;
      selectAll.indeterminate = visibleSelected > 0 && visibleSelected < visibleChecks.length;
      rows.forEach(function (row) {
        row.classList.toggle('selected', row.querySelector('.row-check').checked);
      });
    }

    selectAll.addEventListener('change', function () {
      checks.forEach(function (item) {
        if (!item.closest('tr').hidden) item.checked = selectAll.checked;
      });
      updateSelection();
    });
    checks.forEach(function (item) { item.addEventListener('change', updateSelection); });
    rows.forEach(function (row) {
      row.addEventListener('click', function (event) {
        if (event.target.closest('input')) return;
        event.preventDefault();
        const checkbox = row.querySelector('.row-check');
        checkbox.checked = !checkbox.checked;
        updateSelection();
      });
    });

    document.getElementById('queryButton').addEventListener('click', queryData);
    document.getElementById('keyword').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') queryData();
    });
    document.getElementById('resetButton').addEventListener('click', function () {
      document.getElementById('keyword').value = '';
      rows.forEach(function (row) { row.hidden = false; });
      updateSelection();
    });
    confirmButton.addEventListener('click', function () {
      showMessage('已选择 ' + checks.filter(function (item) { return item.checked; }).length + ' 项');
    });
    function closeModal() {
      history.length > 1 ? history.back() : showMessage('关闭弹窗');
    }
    document.getElementById('closeButton').addEventListener('click', closeModal);
    document.getElementById('cancelButton').addEventListener('click', closeModal);
  </script>
</body>
</html>
