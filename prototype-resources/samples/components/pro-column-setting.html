<aside class="pro-column-setting" data-component="ProColumnSetting" data-component-source="prototype-resources/samples/components/pro-column-setting.html" hidden>
  <header class="pro-drawer-header">
    <h2>列设置</h2>
    <button class="btn btn-secondary" type="button" data-act="close-column-setting">关闭</button>
  </header>
  <div class="pro-column-list">
    {{COLUMN_ITEMS}}
  </div>
  <footer class="pro-drawer-footer">
    <button class="btn btn-secondary" type="button" data-act="reset-columns">恢复默认</button>
    <button class="btn btn-primary" type="button" data-act="save-columns">保存</button>
  </footer>
</aside>
