<section class="card pro-upload-list" data-component="ProUploadList" data-component-source="prototype-resources/samples/components/pro-upload-list.html">
  <div class="pro-section-header">
    <h2 class="card-title">{{TITLE}}</h2>
    <div class="pro-section-extra">
      <button class="btn btn-primary" type="button" data-act="upload">上传附件</button>
      {{ACTIONS}}
    </div>
  </div>
  <div class="pro-upload-dropzone">
    <strong>拖拽文件到此处，或点击上传</strong>
    <span>支持合同、发票、验收单、凭证附件等业务资料</span>
  </div>
  <div class="pro-table-scroll">
    <table class="table pro-table">
      <thead><tr>{{COLUMNS}}</tr></thead>
      <tbody>{{ROWS}}</tbody>
    </table>
  </div>
</section>
