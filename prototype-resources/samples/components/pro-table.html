<section class="card pro-table-card" data-component="ProTable" data-component-source="prototype-resources/samples/components/pro-table.html" data-page-size="5" data-row-policy="status-one-each-or-five" data-operation-column="delete-only-fixed-right" data-fixed-columns="selection-and-identifier-left" data-entry-policy="identifier-link" data-delete-policy="draft-only-for-workflow">
  <div class="pro-table-scroll" data-scroll-axis="x">
    <table class="table pro-table">
      <thead>
        <tr>{{COLUMNS}}</tr>
      </thead>
      <tbody>{{ROWS}}</tbody>
      {{SUMMARY_ROW}}
    </table>
  </div>
  <div class="pro-table-footer">
    <div class="pro-table-selection">
      {{TOTAL_INFO}}
      <label class="pro-page-size-label">
        <span class="select page-size-select" data-fixed-page-size role="status" aria-label="每页5条">5条/页</span>
      </label>
    </div>
    <div class="pro-table-pagination">
      {{PAGINATION}}
    </div>
  </div>
</section>
