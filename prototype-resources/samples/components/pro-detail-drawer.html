<aside class="pro-detail-drawer" data-component="ProDetailDrawer" data-component-source="prototype-resources/samples/components/pro-detail-drawer.html" hidden>
  <header class="pro-drawer-header">
    <div>
      <h2>{{TITLE}}</h2>
      <p>{{SUBTITLE}}</p>
    </div>
    <button class="btn btn-secondary" type="button" data-act="close-drawer">关闭</button>
  </header>
  <div class="pro-drawer-body">
    {{BODY}}
  </div>
  <footer class="pro-drawer-footer">
    {{ACTIONS}}
  </footer>
</aside>
