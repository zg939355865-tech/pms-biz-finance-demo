<div class="modal-overlay" data-component="ProDataSelectModal" data-component-source="prototype-resources/samples/components/pro-data-select-modal.html" hidden>
  <section class="pro-modal pro-data-select-modal" role="dialog" aria-modal="true" aria-labelledby="{{MODAL_ID}}Title">
    <header class="pro-modal-header">
      <h2 id="{{MODAL_ID}}Title">{{TITLE}}</h2>
      <button class="btn btn-secondary" type="button" data-act="close-modal">关闭</button>
    </header>
    <div class="pro-modal-body">
      {{SEARCH_FORM}}
      {{PRO_TABLE}}
    </div>
    <footer class="pro-modal-footer">
      <span class="pro-table-selection">已选择 {{COUNT}} 条</span>
      <button class="btn btn-secondary" type="button" data-act="cancel">取消</button>
      <button class="btn btn-primary" type="button" data-act="confirm">确定</button>
    </footer>
  </section>
</div>
